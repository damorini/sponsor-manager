{% comment %}Stili condivisi delle pagine di autenticazione (login-style brand).{% endcomment %}
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
  .vt-serif { font-family: 'Fraunces', Georgia, 'Times New Roman', serif; }
  .vt-panel {
    background:
      radial-gradient(120% 120% at 0% 0%, rgba(200,160,78,.22) 0%, rgba(200,160,78,0) 42%),
      radial-gradient(90% 90% at 100% 100%, rgba(255,255,255,.10) 0%, rgba(255,255,255,0) 40%),
      linear-gradient(160deg, #1d6534 0%, #154a26 45%, #0d3318 100%);
    position: relative; overflow: hidden;
  }
  .vt-panel::before {
    content: ""; position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,.10) 1px, transparent 1.4px);
    background-size: 22px 22px; opacity: .5;
    -webkit-mask-image: radial-gradient(80% 70% at 30% 30%, #000 30%, transparent 75%);
            mask-image: radial-gradient(80% 70% at 30% 30%, #000 30%, transparent 75%);
  }
  .vt-arcs {
    position: absolute; right: -120px; bottom: -120px;
    width: 420px; height: 420px; border-radius: 9999px;
    border: 1px solid rgba(200,160,78,.35);
    box-shadow: 0 0 0 48px rgba(200,160,78,.05) inset, 0 0 0 96px rgba(255,255,255,.04) inset;
    pointer-events: none;
  }
  .vt-hairline { height: 2px; width: 56px; background: linear-gradient(90deg,#c8a04e,#e7cf9b); border-radius: 2px; }
  @keyframes vtUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .vt-up { opacity: 0; animation: vtUp .7s cubic-bezier(.2,.7,.2,1) forwards; }
  .vt-d1 { animation-delay: .05s; } .vt-d2 { animation-delay: .15s; }
  .vt-d3 { animation-delay: .25s; } .vt-d4 { animation-delay: .35s; } .vt-d5 { animation-delay: .45s; }
  .vt-field input { transition: box-shadow .15s ease, border-color .15s ease, background .15s ease; }
  body > div > footer { margin-top: 0 !important; }
</style>
