{% extends "portal/base.html" %}

{% block title %}Password aggiornata{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center px-4">
  <div class="max-w-md w-full text-center">
    <div class="bg-white rounded-lg shadow-md p-8">
      <div class="mx-auto h-16 w-16 bg-green-100 rounded-full flex items-center justify-center mb-4">
        <svg class="h-8 w-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M5 13l4 4L19 7"></path>
        </svg>
      </div>
      
      <h1 class="text-2xl font-bold text-gray-900 mb-2">Password aggiornata</h1>
      <p class="text-gray-600 mb-6">
        La tua password è stata aggiornata con successo. Ora puoi accedere
        con le nuove credenziali.
      </p>
      
      <a href="{% url 'portal:login' %}" 
         class="inline-block bg-brand-500 hover:bg-brand-700 text-white font-medium py-2 px-6 rounded-md transition-colors">
        Vai al login
      </a>
    </div>
  </div>
</div>
{% endblock %}
