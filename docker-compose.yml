# Variabili applicative condivise da web / celery_worker / celery_beat.
# I segreti (SECRET_KEY, DB_PASSWORD, ALLOWED_HOSTS) vanno messi nel file .env
# accanto a questo compose: senza, l'avvio si ferma con un messaggio chiaro.
x-app-env: &app-env
  DJANGO_SETTINGS_MODULE: config.settings.production
  DEBUG: "False"
  SECRET_KEY: ${SECRET_KEY:?Definisci SECRET_KEY nel file .env}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Definisci ALLOWED_HOSTS nel file .env (es. valet.it,www.valet.it)}
  DB_NAME: sponsor_manager
  DB_USER: sponsor
  DB_PASSWORD: ${DB_PASSWORD:?Definisci DB_PASSWORD nel file .env}
  DB_HOST: db
  DB_PORT: "5432"
  REDIS_URL: redis://redis:6379/0
  # Lascia True in produzione (HTTPS). Metti False solo se il TLS è gestito
  # da un proxy davanti o per collaudo locale in HTTP.
  SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-True}

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: sponsor_manager_db
    environment:
      POSTGRES_DB: sponsor_manager
      POSTGRES_USER: sponsor
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Definisci DB_PASSWORD nel file .env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sponsor"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sponsor_network

  # Redis (broker Celery + cache)
  redis:
    image: redis:7-alpine
    container_name: sponsor_manager_redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sponsor_network

  # Django (Gunicorn)
  web:
    build: .
    container_name: sponsor_manager_web
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py compilemessages -l en --ignore=venv &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 60"
    environment:
      <<: *app-env
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/').status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - sponsor_network

  # Celery worker (email, generazione PDF, ecc.)
  celery_worker:
    build: .
    container_name: sponsor_manager_celery_worker
    command: celery -A config worker -l info
    environment:
      <<: *app-env
    # L'immagine ha un HEALTHCHECK HTTP (per 'web'); qui non serve (no server HTTP).
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_data:/app/media
    networks:
      - sponsor_network

  # Celery beat (task schedulati: reminder, solleciti, recovery carrelli)
  celery_beat:
    build: .
    container_name: sponsor_manager_celery_beat
    command: celery -A config beat -l info
    environment:
      <<: *app-env
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sponsor_network

  # Caddy: reverse proxy pubblico con HTTPS automatico (Let's Encrypt) + static/media.
  # In .env imposta SITE_ADDRESS=tuodominio.it (in locale resta 'localhost').
  caddy:
    image: caddy:2-alpine
    container_name: sponsor_manager_caddy
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    networks:
      - sponsor_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  media_data:
    driver: local
  static_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  sponsor_network:
    driver: bridge
